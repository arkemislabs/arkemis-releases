# Builds and publishes an Arkemis desktop release, in the PUBLIC arkemislabs/arkemis-releases
# repository: GitHub's standard Windows and macOS runners and Actions storage are free for
# public repositories, so a release costs nothing. The private source never lands in this
# repository: each job checks out arkemislabs/arkemis at the release tag with a read-only
# token, builds on a throwaway runner, and only the installers are published here.
#
# Source of truth: arkemislabs/arkemis deploy/public-release-builder/build.yml (copied to
# .github/workflows/build.yml in arkemis-releases by the release script's setup step).
#
# Started by `npm run release -- X.Y.Z` (it tags the source and dispatches this workflow), or
# by "Run workflow" with a tag. Only people with write access to this repository can start it;
# it has no pull_request trigger, and forks never receive secrets.
#
# Secret (Settings -> Secrets and variables -> Actions):
#   SOURCE_TOKEN  fine-grained token owned by arkemislabs, repository arkemislabs/arkemis only,
#                 permission Contents: Read-only, with an expiry date.
#   ARKEMIS_UPDATE_SIGNING_KEY  the update signing key (`node scripts/update-signing.mjs --export`
#                 on the publishing PC). Publishing stops without it; apps refuse unsigned updates.
# Publishing uses this repository's own GITHUB_TOKEN (contents: write on the publish job only).
name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag in arkemislabs/arkemis (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish the release here when the builds pass
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  windows:
    name: Windows (NSIS x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check the tag and the source token
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must look like v1.2.3"; exit 1; }
          [ -n "$SOURCE_TOKEN" ] || { echo "::error::Add the SOURCE_TOKEN secret (read-only token for arkemislabs/arkemis)."; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: arkemislabs/arkemis
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - name: The tag matches the app version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build, package and gate the Windows installer
        run: node scripts/release.mjs --ci-package --out dist/release-assets
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-windows
          path: dist/release-assets/
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS (DMG + ZIP, arm64 + x64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check the tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must look like v1.2.3"; exit 1; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: arkemislabs/arkemis
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - name: The tag matches the app version
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Packaging, release and updater tests; typecheck
        run: |
          node --test tests/release-package.test.mjs tests/release-versioning.test.mjs tests/app-updater.test.mjs
          npm run typecheck
      - name: Compile the native helpers (universal arm64 + x86_64)
        run: npm run build:native:macos
      - name: Mac window placement (notch at the top, Mac title bar, Edit menu)
        run: |
          npm run build
          node tests/mac-window-placement.e2e.mjs
      - name: Load the stable Mac signing identity (keeps permissions across updates)
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MAC_SIGNING_IDENTITY" ]; then
            echo "No MAC_SIGNING_IDENTITY secret: the Mac apps stay ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/arkemis-signing.keychain-db"
          password="$(openssl rand -hex 16)"
          printf '%s' "$MAC_SIGNING_IDENTITY" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "arkemis-signing" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          hash="$(security find-identity -p codesigning "$keychain" | awk '/Arkemis/ {print $2; exit}')"
          [ -n "$hash" ] || { echo "::error::The Mac signing identity did not import"; exit 1; }
          echo "ARKEMIS_MAC_SIGN_IDENTITY=$hash" >> "$GITHUB_ENV"
          echo "ARKEMIS_MAC_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build, package and gate the macOS apps
        run: node scripts/release.mjs --ci-package --out dist/release-assets
      - name: In-place Mac update (download, checksum, signature, swap)
        run: node tests/mac-update-swap.e2e.mjs dist/release-assets
      - name: Inspect the app bundles
        run: |
          for app in dist/release-darwin-*/artifacts/mac*/Arkemis.app; do
            echo "== $app"
            echo "Electron: $(lipo -archs "$app/Contents/MacOS/Arkemis")"
            echo "Helpers:  $(lipo -archs "$app/Contents/Resources/app.asar.unpacked/main/native/macos/keyboard-listener")"
            test -f "$app/Contents/Resources/app.asar"
            test ! -d "$app/Contents/Resources/app"
            test -f "$app/Contents/Resources/app-update.yml"
            codesign --verify --deep --strict "$app"
            echo "Signature: $(codesign -d -r- "$app" 2>&1 | grep designated)"
          done
          ls -la dist/release-assets
      - name: Keep the Mac placement evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: mac-placement-evidence
          path: |
            dist/test-evidence/mac-notch-top.png
            dist/test-evidence/mac-window-placement.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-macos
          path: dist/release-assets/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the release
    needs: [windows, macos]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: arkemislabs/arkemis
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.SOURCE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*
          path: dist/release-assets
          merge-multiple: true
      - name: Upload every platform and publish the release here
        env:
          GH_TOKEN: ${{ github.token }}
          # Ed25519 key that signs latest*.yml (scripts/update-signing.mjs --export); installed
          # apps refuse updates without its signature, and publishing stops without it.
          ARKEMIS_UPDATE_SIGNING_KEY: ${{ secrets.ARKEMIS_UPDATE_SIGNING_KEY }}
        run: node scripts/release.mjs --ci-publish dist/release-assets
